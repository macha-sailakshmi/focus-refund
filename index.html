<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Refund</title>
  
  <!-- This loads Tailwind so we can use colors like bg-blue-600 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">
  
  <!-- This centers everything on screen. Harry #44 Flexbox -->
  <div class="min-h-screen flex items-center justify-center">
    
    <!-- This holds all your content -->
    <div class="text-center p-6">
      
      <!-- Big heading: text-5xl = really big text -->
      <h1 class="text-5xl font-bold mb-4">
        Stop Doomscrolling
      </h1>
      
      <!-- Small text: text-xl = medium text, text-gray-400 = light gray -->
      <p class="text-xl text-gray-400 mb-8">
        Get paid to stay focused
      </p>
      
      <!-- Button: bg-blue-600 = blue color, px-6 = padding left/right, py-3 = padding top/bottom -->
      <button class="bg-green-600 px-6 py-3 rounded-lg text-lg font-semibold">
        Start Now
      </button>
      
    </div>
  </div>
  
</body>
</html>
