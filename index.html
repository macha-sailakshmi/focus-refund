<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusRefund - Reclaim Your Attention</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #f8fafc;
      --muted: #cbd5e1;
      --coin: #facc15;
      --coin-dark: #ca8a04;
      --red: #ef4444;
      --panel: rgba(15, 23, 42, 0.72);
      --line: rgba(148, 163, 184, 0.24);
      --font: "Cascadia Code", "Roboto Mono", "JetBrains Mono", "Consolas", monospace;
    }
    body {
      font-family: var(--font);
      background:
        radial-gradient(circle at 18% 16%, rgba(250, 204, 21, 0.18), transparent 30rem),
        radial-gradient(circle at 82% 18%, rgba(202, 138, 4, 0.12), transparent 28rem),
        linear-gradient(135deg, #05070b 0%, #0b0f17 56%, #111827 100%);
      min-height: 100vh;
      color: var(--ink);
      padding: 24px;
    }
    .page {
      min-height: calc(100vh - 48px);
      display: grid;
      grid-template-rows: auto 1fr;
      max-width: 1120px;
      margin: 0 auto;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-weight: 800;
      padding: 8px 0;
    }
    nav span:last-child {
      color: var(--coin);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .container {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 0.95fr);
      gap: 36px;
      align-items: center;
      padding: 34px 0 48px;
    }
    .eyebrow {
      color: var(--coin);
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      margin-bottom: 18px;
      text-transform: uppercase;
    }
    h1 {
      color: #f8fafc;
      font-size: clamp(2.35rem, 5.5vw, 4.4rem);
      line-height: 1.04;
      margin-bottom: 20px;
      max-width: 720px;
      font-weight: 900;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
      max-width: 620px;
      margin-bottom: 34px;
    }
    .actions { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 12px;
      color: white;
      font-weight: 900;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn.primary { color: #111827; background: linear-gradient(135deg, var(--coin), var(--coin-dark)); }
    .btn.secondary { border: 1px solid var(--line); background: rgba(255,255,255,0.06); }
    .hero-note {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 22px;
    }
    .hero-note::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--red);
      box-shadow: 0 0 22px rgba(239, 68, 68, 0.58);
    }
    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: rgba(255,255,255,0.05);
    }
    .metric strong { display: block; font-size: 1.35rem; }
    .metric span { color: var(--muted); font-size: 0.82rem; }
    .product-preview {
      position: relative;
      min-height: 470px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(250, 204, 21, 0.14), rgba(202, 138, 4, 0.08)),
        rgba(15, 23, 42, 0.72);
      box-shadow: 0 28px 90px rgba(0,0,0,0.34);
      overflow: hidden;
    }
    .product-preview::before {
      content: "";
      position: absolute;
      inset: -40% -20% auto auto;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.16);
      filter: blur(24px);
    }
    .mini-window,
    .lock-window {
      position: relative;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 20px;
      background: rgba(8, 17, 31, 0.82);
      box-shadow: 0 22px 70px rgba(0,0,0,0.32);
      animation: floatIn 700ms ease both;
    }
    .mini-window { padding: 18px; }
    .window-top { display: flex; gap: 8px; margin-bottom: 18px; }
    .window-top span {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #475569;
    }
    .preview-title { margin-bottom: 18px; }
    .preview-title h2 {
      color: white;
      font-size: 1.35rem;
      margin-bottom: 6px;
    }
    .preview-title p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
      margin: 0;
    }
    .preview-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 14px;
      margin-top: 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
    }
    .preview-row strong { display: block; color: white; }
    .preview-row small { color: var(--muted); }
    .coin-pill {
      color: #111827;
      padding: 8px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--coin), var(--coin-dark));
      font-weight: 900;
    }
    .lock-window {
      width: calc(100% - 48px);
      margin: 18px auto 0;
      padding: 20px;
      text-align: center;
      animation-delay: 140ms;
    }
    .lock-window h3 { font-size: 1.35rem; margin-bottom: 8px; }
    .lock-window p { margin: 0 0 16px; font-size: 0.96rem; }
    .react-badge {
      display: inline-flex;
      margin-top: 18px;
      border: 1px solid rgba(250, 204, 21, 0.35);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--coin);
      background: rgba(250, 204, 21, 0.08);
      font-size: 0.8rem;
      font-weight: 900;
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 820px) {
      body { padding: 16px; }
      .page { min-height: calc(100vh - 32px); }
      .container { grid-template-columns: 1fr; gap: 28px; }
      .metric-row { grid-template-columns: 1fr; }
      .product-preview { min-height: auto; }
      .lock-window { width: 100%; margin-top: 16px; transform: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const e = React.createElement;

    const metrics = [
      ["50", "coins to unlock"],
      ["10m", "focused access"],
      ["5", "age task lists"],
    ];

    const previewTasks = [
      { name: "Deep work 90min", type: "Once today", coins: "+20" },
      { name: "Read 20min", type: "Repeatable", coins: "+10" },
    ];

    function App() {
      return e("div", { className: "page" },
        e("nav", null,
          e("span", null, "FocusRefund"),
          e("span", null, "React + Extension")
        ),
        e("main", { className: "container" },
          e("section", null,
            e("div", { className: "eyebrow" }, "Spend focus, not willpower"),
            e("h1", null, "Reclaim your scroll time."),
            e("p", null, "FocusRefund turns distracting sites into a coin economy: complete real tasks, earn Focus Coins, and unlock them only when you choose to spend them."),
            e("div", { className: "actions" },
              e("a", { href: "extension/dashboard/index.html", className: "btn primary" }, "Open The Brain"),
              e("a", { href: "interceptor/stopscroll.html", className: "btn secondary" }, "See The Muscle")
            ),
            e("div", { className: "hero-note" }, "Built as a React web layer plus a Chrome extension blocker."),
            e("div", { className: "react-badge" }, "React-powered landing page"),
            e("div", { className: "metric-row" },
              metrics.map(([value, label]) =>
                e("div", { className: "metric", key: label },
                  e("strong", null, value),
                  e("span", null, label)
                )
              )
            )
          ),
          e("section", { className: "product-preview", "aria-label": "FocusRefund product preview" },
            e("div", { className: "mini-window" },
              e("div", { className: "window-top" }, e("span"), e("span"), e("span")),
              e("div", { className: "preview-title" },
                e("h2", null, "The Brain"),
                e("p", null, "Earn coins by finishing tasks that match your age group.")
              ),
              previewTasks.map((task) =>
                e("div", { className: "preview-row", key: task.name },
                  e("div", null, e("strong", null, task.name), e("small", null, task.type)),
                  e("span", { className: "coin-pill" }, task.coins)
                )
              )
            ),
            e("div", { className: "lock-window" },
              e("h3", null, "The Muscle"),
              e("p", null, "Distracting sites stay locked until Focus Coins are spent.")
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>
