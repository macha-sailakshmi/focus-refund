<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Refund - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard">
    <a href="../index.html" style="position:absolute;top:20px;left:20px;color:white;text-decoration:none;opacity:0.7;">← Home</a>

    <div class="glass-card">
        <h2>Welcome, <span id="userAgeDisplay">18-22</span></h2>
        <h3>Coins: <span id="coinCount">0</span></h3>

        <label>Select Age: 
            <select id="ageSelect">
                <option value="13-17">13-17</option>
                <option value="18-22" selected>18-22</option>
                <option value="23-27">23-27</option>
                <option value="28-35">28-35</option>
                <option value="35+">35+</option>
            </select>
        </label>

        <div id="taskList"></div>
        <button id="unlockBtn" disabled>Unlock Instagram -50 coins</button> 
    </div>
    
    <script src="app.js"></script>
</body>
</html>
