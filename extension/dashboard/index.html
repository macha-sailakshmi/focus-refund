<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusRefund - The Brain</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard">
    <main class="dashboard-shell">
        <nav class="dashboard-nav">
            <a href="https://focus-refund.pages.dev/" target="_blank" rel="noopener" class="back-link">Back Home</a>
            <span class="product-mark">FocusRefund</span>
        </nav>

        <section class="brain-panel">
            <div class="brain-header">
                <div>
                    <p class="eyebrow">The Brain</p>
                    <h1>Earn Focus Coins</h1>
                    <p class="header-copy">Pick your age group, finish real tasks, and spend coins only when you choose to unlock Instagram.</p>
                </div>
                <div class="coin-balance">
                    <span>Coins</span>
                    <strong id="coinCount">0</strong>
                </div>
            </div>

            <div class="controls-row">
                <div>
                    <span class="control-label">Current age group</span>
                    <strong id="userAgeDisplay">18-22</strong>
                </div>
                <label>
                    <span class="control-label">What is your age group?</span>
                    <select id="ageSelect">
                        <option value="13-17">13-17</option>
                        <option value="18-22" selected>18-22</option>
                        <option value="23-27">23-27</option>
                        <option value="28-35">28-35</option>
                        <option value="35+">35+</option>
                    </select>
                    <span id="ageLockStatus" class="helper-text"></span>
                </label>
                <button id="unlockBtn" disabled>Unlock Instagram -50 coins</button>
            </div>

            <div id="taskList" class="task-list"></div>
        </section>
    </main>
    
    <script src="app.js"></script>
</body>
</html>
