<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body { 
      width: 280px; 
      margin: 0;
      padding: 16px; 
      font-family: "Cascadia Code", "Roboto Mono", "JetBrains Mono", "Consolas", monospace;
      background:
        radial-gradient(circle at 20% 0%, rgba(250, 204, 21, 0.22), transparent 11rem),
        #05070b;
      color: white; 
      --coin: #facc15;
      --red: #ef4444;
    }
    .popup-card {
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.72);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    }
    h3 {
      margin: 0 0 14px;
      color: #facc15;
      font-family: "Cascadia Code", "Roboto Mono", "JetBrains Mono", "Consolas", monospace;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0;
    }
    .balance-card {
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 14px;
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.28);
    }
    .balance-card span:first-child {
      display: block;
      color: #cbd5e1;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    #balance {
      font-family: "Cascadia Code", "Roboto Mono", "JetBrains Mono", "Consolas", monospace;
      color: var(--coin);
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1;
      margin-top: 8px;
    }
    button { 
      width: 100%; 
      min-height: 44px;
      padding: 10px 12px; 
      margin-top: 10px; 
      background: #111827;
      color: white;
      border: 1px solid rgba(250, 204, 21, 0.24);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    button:hover { background: #1f2937; transform: translateY(-1px); }
    #openDashboard {
      color: #111827;
      background: linear-gradient(135deg, #facc15, #ca8a04);
    }
    #openDashboard:hover {
      background: linear-gradient(135deg, #fde047, #ca8a04);
    }
  </style>
</head>
<body>
  <div class="popup-card">
    <h3>FocusRefund</h3>
    <div class="balance-card">
      <span>Balance</span>
      <div><span id="balance">--</span> coins</div>
    </div>
    <button id="unlockBtn">Unlock 10 min for 50 coins</button>
    <button id="openDashboard">Open The Brain Dashboard</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
